name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the version tag
      id-token: write # RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec rake
      - uses: rubygems/release-gem@v1.4.1
